<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>KGM Cables - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="/static/css/style.css" rel="stylesheet" />
  <style>
    body.login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      border: none;
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-header h2 {
      font-weight: 800;
      color: var(--ink);
    }
    .login-header p {
      color: var(--muted);
    }
    .form-control-lg {
      padding: 0.9rem 1rem;
      border-radius: 10px;
    }
    .btn-lg {
      padding: 0.9rem 1rem;
      border-radius: 10px;
      font-weight: 700;
    }
  </style>
</head>
<body class="login-page">
  <div class="card login-card">
    <div class="login-header">
      <img src="/static/img/logo.png" alt="KGM Cables" style="height: 50px; margin-bottom: 1rem;">
      <h2>Private Access</h2>
      <p>Please enter the password to continue.</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('main.login') }}">
      <div class="mb-3">
        <input type="password" name="password" class="form-control form-control-lg" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100">Unlock</button>
    </form>
  </div>

  <script>
    // Basic theme detection to prevent flash of wrong theme
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "light") {
      document.body.classList.add("light-mode");
    }
  </script>
</body>
</html>
